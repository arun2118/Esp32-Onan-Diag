[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

board_build.partitions = partitions.csv

; FIXED: Standard WebServer.h does not require external async library downloads.
; If you are using standard WebServer handlers, leave lib_deps empty or comment it out.
lib_deps =

; --- Add these lines below for VS Code Wireless Upload ---
;upload_protocol = espota
;upload_port = 192.168.4.1



